[tool.poetry]
name = "narzedzia-lh-pl"
version = "0.1.0"
description = "Mail / SSL / DNS tester"
authors = ["Maciej Kacprzak"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
redis = {extras = ["hiredis"], version = "^5.0"}
pydantic-settings = "^2.3"
httpx = "^0.27"
cryptography = "^42"
dnspython = "^2.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pytest-asyncio = "^0.23"
asgi-lifespan = "^2.1"
ruff = "^0.6"
mypy = "^1.11"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "skip"
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "network: testy wymagające dostępu do internetu",
]
